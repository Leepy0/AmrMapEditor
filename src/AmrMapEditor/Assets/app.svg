<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5E7089"/><stop offset="1" stop-color="#36424F"/>
  </linearGradient>
  <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3B9CFF"/><stop offset="1" stop-color="#0062CC"/>
  </linearGradient>
  <clipPath id="room"><path d="M56 64 H168 V120 H200 V192 H56 Z"/></clipPath>
</defs>
<!-- 배경: Unknown 청회색 -->
<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
<!-- Free 영역 (흰색) + 픽셀 격자 -->
<path d="M56 64 H168 V120 H200 V192 H56 Z" fill="#FFFFFF"/>
<g clip-path="url(#room)"><line x1="72" y1="64" x2="72" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="88" y1="64" x2="88" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="104" y1="64" x2="104" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="120" y1="64" x2="120" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="136" y1="64" x2="136" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="152" y1="64" x2="152" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="168" y1="64" x2="168" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="184" y1="64" x2="184" y2="192" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="80" x2="200" y2="80" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="96" x2="200" y2="96" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="112" x2="200" y2="112" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="128" x2="200" y2="128" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="144" x2="200" y2="144" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="160" x2="200" y2="160" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/><line x1="56" y1="176" x2="200" y2="176" stroke="#1D1D1F" stroke-opacity="0.07" stroke-width="2"/></g>
<!-- 벽 (검정) : 오른쪽 아래 구간은 펜이 그리는 중 → 파랑 -->
<path d="M200 184 V120 H168 V64 H56 V192 H140" fill="none" stroke="#1D1D1F" stroke-width="16" stroke-linejoin="miter"/>
<path d="M140 192 H200 V184" fill="none" stroke="#0A84FF" stroke-width="16" stroke-linejoin="miter" stroke-linecap="butt"/>
<!-- 안쪽 장애물 (랙) -->
<rect x="92" y="104" width="44" height="16" fill="#1D1D1F"/>
<!-- 펜 -->
<g transform="translate(202 194) rotate(-45)">
  <path d="M0 0 L14 -24 H-14 Z" fill="#1D1D1F"/>
  <rect x="-14" y="-24" width="28" height="68" fill="url(#pen)"/>
  <rect x="-14" y="-24" width="28" height="10" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="-14" y="44" width="28" height="12" rx="4" fill="#0A3F80"/>
  <path d="M0 0 L5 -9 H-5 Z" fill="#9AA3AD"/>
</g>
</svg>