name: Build EXE

# main push   → 테스트 빌드: Release "dev" (prerelease) 덮어쓰기. 자동 업데이트 대상 아님
# 정식 배포   → Release "vX.Y.Z" (Latest). 프로그램 자동 업데이트가 이것만 받음
#   1) 태그 vX.Y.Z push, 또는
#   2) Actions 탭 › Run workflow › '정식 배포' 체크 (csproj 버전으로 태그 · 릴리스 생성)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release:
        description: '정식 배포 (csproj <Version>으로 vX.Y.Z 태그 · 릴리스 생성)'
        type: boolean
        default: false

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # Release 생성 · 갱신

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 릴리스 노트용 이전 태그 조회

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 버전 · 채널 결정
        id: ver
        run: |
          BASE=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/AmrMapEditor/AmrMapEditor.csproj | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            if [ "$VER" != "$BASE" ]; then
              echo "::error::태그($GITHUB_REF_NAME)와 csproj <Version>($BASE)이 다릅니다. csproj 버전을 올려 커밋한 뒤 그 커밋에 태그를 붙이세요."
              exit 1
            fi
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "exe=AmrMapEditor.exe" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            VER="$BASE"
            TAGGED=$(git rev-parse -q --verify "refs/tags/v$VER^{commit}" || true)
            if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::v$VER 태그가 이미 다른 커밋에 있습니다. csproj <Version>을 올려 커밋한 뒤 다시 실행하세요."
              exit 1
            fi
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "exe=AmrMapEditor.exe" >> "$GITHUB_OUTPUT"
          else
            VER="$BASE"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "exe=AmrMapEditor-dev.exe" >> "$GITHUB_OUTPUT"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # .NET 런타임 포함(self-contained) 단일 exe: 설치 없이 실행
      - name: Publish
        run: |
          dotnet publish src/AmrMapEditor/AmrMapEditor.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version=${{ steps.ver.outputs.ver }} -p:SourceRevisionId=$GITHUB_SHA \
            -p:BuildChannel=${{ steps.ver.outputs.channel }} \
            -o publish

      - name: 파일명 · SHA-256
        run: |
          cd publish
          if [ "${{ steps.ver.outputs.exe }}" != "AmrMapEditor.exe" ]; then mv AmrMapEditor.exe "${{ steps.ver.outputs.exe }}"; fi
          sha256sum "${{ steps.ver.outputs.exe }}" > "${{ steps.ver.outputs.exe }}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.exe }}
          path: publish/${{ steps.ver.outputs.exe }}

      # 정식 배포: 이전 태그 이후 커밋 메시지로 릴리스 노트
      - name: Release (정식 vX.Y.Z)
        if: steps.ver.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$GITHUB_SHA"
          {
            echo "Windows x64 단일 exe · 설치 없이 실행 (.NET 포함)"
            echo "실행 중인 프로그램은 시작할 때 이 버전을 확인하고, 받아 두면 닫을 때 바뀝니다."
            echo
            git log --no-merges --pretty='tformat:%s%n%n%b' $RANGE | sed -E '/^(Co-Authored-By|Claude-Session):/d' | cat -s
            if [ -n "$PREV" ]; then
              echo
              echo "전체 변경: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...v$VER"
            fi
          } > notes.md
          cat notes.md
          gh release delete "v$VER" -y 2>/dev/null || true   # 같은 태그 재실행 시 (태그는 유지)
          # 태그 push면 그 태그로, 수동 실행이면 이 커밋에 태그 생성
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAGOPT=(--verify-tag); else TAGOPT=(--target "$GITHUB_SHA"); fi
          gh release create "v$VER" publish/AmrMapEditor.exe publish/AmrMapEditor.exe.sha256 \
            "${TAGOPT[@]}" --latest --title "v$VER" --notes-file notes.md

      # 테스트 빌드: 항상 같은 주소(dev)로 덮어쓰기
      - name: Release (테스트 dev)
        if: steps.ver.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true   # 이전 방식(latest 태그) 정리
          gh release delete dev --cleanup-tag -y 2>/dev/null || true
          gh release create dev publish/AmrMapEditor-dev.exe publish/AmrMapEditor-dev.exe.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "테스트 빌드 (main)" \
            --notes "branch: ${GITHUB_REF_NAME} / commit: ${GITHUB_SHA::7} / run #${GITHUB_RUN_NUMBER} · 자동 업데이트 대상 아님 · 정식 배포는 Latest 릴리스"
